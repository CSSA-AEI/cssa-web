name: Deploy to Cloudflare Pages

on:
    push:
        branches:
            - React-version-cssa-web

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write

        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            # Building
            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                node-version: 18
            
            - name: Install Dependencies
              working-directory: ./cssa-website-react
              run: npm install

            - name: Build Site
              working-directory: ./cssa-website-react
              run: npm run build
            
            # Send to Cloudflare
            - name: Publish to Cloudflare Pages
              uses: cloudflare/pages-action@v1
              with:
                apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                projectName: cssa-website
                directory: cssa-website-react/build
                gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                branch: React-version-cssa-web